server {
    listen 80;

    # Look the API up through Docker's DNS on every request (cached 10 s), so a
    # restarted API container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API, including clip playback and uploads.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;          # source videos can be several gigabytes
        proxy_request_buffering off;     # stream uploads straight through
        proxy_buffering off;             # stream video with range requests
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /healthz {
        proxy_pass $api;
    }

    # File names carry a content hash, so they can be cached for good.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a page of the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
