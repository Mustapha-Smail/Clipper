[project]
name = "clipper"
version = "1.8.0"
description = "Turns long videos into captioned vertical clips: API, worker and CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "anthropic",
    "fastapi",
    "numpy",
    "onnxruntime",
    "opencv-python-headless",
    "pillow",
    "psycopg[binary]",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "rapidocr",
    "sqlalchemy>=2.0",
    "typer",
    "uvicorn",
    "yt-dlp[default]",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper; sys_platform == 'linux'",
    "kokoro-onnx>=0.6.1",
    "resvg-py>=0.5.0",
    "openai>=3.49.0",
    "svgelements>=1.9.6",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
clipper = "clipper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the framework's idiom
